name: PolyTail early (sharp wallets)

on:
  schedule:
    - cron: "2-59/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polytail-early
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sharp wallets for fresh bets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ALERTS: "0"   # silent test; change to "1" once it proves itself
        run: python early.py

      - name: Save state and signal log
        run: |
          git config user.name "polytail-bot"
          git config user.email "polytail-bot@users.noreply.github.com"
          for f in state_early.json signals_early.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Update early-tail log"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
