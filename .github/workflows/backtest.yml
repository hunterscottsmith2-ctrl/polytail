name: PolyTail backtest

on:
  # Weekly report-only run of both tests: Saturdays ~2:37am Eastern, so the report is in
  # before Sunday's scorecard. It does NOT change the live wallet lists.
  schedule:
    - cron: "37 7 * * 6"
  workflow_dispatch:
    inputs:
      category:
        description: "Which test: overall (all markets) or sports (game markets only)"
        type: choice
        options: [overall, sports]
        default: overall
      lookback_days:
        description: "Total days of history (training + test)"
        default: "240"
      test_days:
        description: "Most recent days held out for testing"
        default: "90"
      pool_depth:
        description: "Wallets to pull from each leaderboard (multiples of 50)"
        default: "100"
      update_live_wallets:
        description: "Replace the live wallet lists with this run's picks (changes who the alerts watch)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        category: ${{ github.event_name == 'schedule' && fromJSON('["overall","sports"]') || fromJSON(format('["{0}"]', inputs.category)) }}
    concurrency:
      group: polytail-backtest-${{ matrix.category }}
      cancel-in-progress: false
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: polytail-cache-${{ github.run_id }}
          restore-keys: polytail-cache-

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BT_LOOKBACK_DAYS: ${{ inputs.lookback_days || '240' }}
          BT_TEST_DAYS: ${{ inputs.test_days || '90' }}
          BT_POOL_DEPTH: ${{ inputs.pool_depth || '100' }}
          BT_CATEGORY: ${{ matrix.category }}
          BT_REPORT_ONLY: ${{ inputs.update_live_wallets == true && '0' || '1' }}
        run: python backtest.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "polytail-bot"
          git config user.email "polytail-bot@users.noreply.github.com"
          [ -d results ] && git add results
          for f in wallets*.json; do [ -f "$f" ] && git add "$f"; done
          git add -u -- 'wallets*.json'   # also commits a removed wallets.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest results"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
