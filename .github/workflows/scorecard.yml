name: PolyTail scorecard

on:
  schedule:
    - cron: "17 13 * * 0"    # Sundays ~8am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grade main alerts (current rules since Nov 20, 3:25 PM ET)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCORECARD_SINCE: "2026-11-20T20:25:00Z"
        run: python scorecard.py

      - name: Grade sports alerts
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYTAIL_LOG: signals_sports.csv
          SCORECARD_LABEL: "🏈 PolyTail Sports"
          SCORECARD_TAG: scorecard_sports
          SCORECARD_FEE_RATE: "0.03"
          SCORECARD_SINCE: "2026-11-20T20:25:00Z"
        run: python scorecard.py

      - name: Grade early sharp-wallet test
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYTAIL_LOG: signals_early.csv
          SCORECARD_LABEL: "🎯 PolyTail Early (sharp wallets)"
          SCORECARD_TAG: scorecard_early
        run: python scorecard.py

      - name: Grade missed alerts (winners test, replayed)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYTAIL_LOG: signals_backfill.csv
          POLYTAIL_FILLS: none.csv
          SCORECARD_LABEL: "🕳️ PolyTail missed alerts (winners test, replayed)"
          SCORECARD_TAG: scorecard_backfill
        run: '[ -f signals_backfill.csv ] && python scorecard.py || true'

      - name: Grade missed alerts (sports test, replayed)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYTAIL_LOG: signals_backfill_sports.csv
          POLYTAIL_FILLS: none.csv
          SCORECARD_LABEL: "🕳️ PolyTail missed alerts (sports test, replayed)"
          SCORECARD_TAG: scorecard_backfill_sports
          SCORECARD_FEE_RATE: "0.03"
        run: '[ -f signals_backfill_sports.csv ] && python scorecard.py || true'

      - name: Save scorecard
        if: always()
        run: |
          git config user.name "polytail-bot"
          git config user.email "polytail-bot@users.noreply.github.com"
          [ -d results ] && git add results
          git diff --cached --quiet && exit 0
          git commit -m "Weekly scorecard"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
